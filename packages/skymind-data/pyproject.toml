[project]
name = "skymind-data"
version = "0.1.0"
description = "SkyMind session recording (Lance)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skymind_data"]
