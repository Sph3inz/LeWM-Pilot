[project]
name = "skymind-llm"
version = "0.1.0"
description = "SkyMind LLM scenario orchestration via OpenRouter"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skymind_llm"]
