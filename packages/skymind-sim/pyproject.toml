[project]
name = "skymind-sim"
version = "0.1.0"
description = "SkyMind JSBSim / jsbgym simulator adapter"
requires-python = ">=3.11"
dependencies = [
    "skymind-data",
    "jsbsim>=1.1.13",
    "gymnasium>=1.0.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
jsbgym = []
keyboard = ["pynput>=1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skymind_sim"]

[tool.uv.sources]
skymind-data = { workspace = true }
